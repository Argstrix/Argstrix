name: update-uptime

on:
  schedule:
    - cron: "0 3 * * *"   # once a day
  workflow_dispatch:       # allow manual trigger
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Update uptime field
        run: python scripts/update_uptime.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/neofetch.svg
          git commit -m "chore: update github uptime" || echo "No changes to commit"
          git push
